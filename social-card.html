<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Social card</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%,var(--bg2) 0%,transparent 52%),
      radial-gradient(circle at 100% 100%,var(--bg2) 0%,transparent 48%);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #social-card{width:100%;height:100%}
  .social-card{
    width:100%;height:100%;padding:58px 72px;
    display:grid;grid-template-columns:360px minmax(0,1fr);gap:70px;align-items:center;
    position:relative;
  }
  .social-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
  }
  .portrait{
    width:340px;height:340px;border-radius:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:3px solid var(--accent-dim);background:var(--bg2);
    color:var(--accent);font:92px Georgia,"Times New Roman",serif;
    box-shadow:0 30px 80px -36px #000;
  }
  .portrait img{width:100%;height:100%;object-fit:cover}
  .content{min-width:0}
  .name{font:72px/1.02 Georgia,"Times New Roman",serif;margin:0 0 15px;letter-spacing:-1.5px}
  .role{font-size:30px;line-height:1.18;color:var(--accent);margin:0 0 9px}
  .company{font-size:23px;color:var(--text-dim);margin:0 0 30px}
  .bio{font-size:25px;line-height:1.42;color:var(--text-dim2);margin:0 0 34px;max-width:36ch}
  .details{display:flex;flex-wrap:wrap;gap:12px 26px;font-size:20px;color:var(--text-dim)}
  .details span{white-space:nowrap}
  .website{position:absolute;right:72px;bottom:40px;font-size:18px;color:var(--text-dim);letter-spacing:.3px}

  @media (max-aspect-ratio:1/1){
    .social-card{padding:120px 84px;display:flex;flex-direction:column;justify-content:center;gap:78px;text-align:center}
    .portrait{width:390px;height:390px;font-size:112px}
    .name{font-size:96px;margin-bottom:28px}
    .role{font-size:43px;margin-bottom:14px}
    .company{font-size:32px;margin-bottom:48px}
    .bio{font-size:34px;line-height:1.5;margin:0 auto 55px;max-width:27ch}
    .details{justify-content:center;gap:20px 36px;font-size:27px}
    .website{position:static;margin-top:5px;font-size:27px}
  }
</style>
</head>
<body>
<main id="social-card" aria-label="Social sharing card"></main>
<script>
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
async function render(){
  const response=await fetch("data.json",{cache:"no-store"});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const data=await response.json();
  const {profile,palette,ui}=data;
  document.documentElement.lang=ui.language||"pt";
  const root=document.documentElement.style;
  root.setProperty("--bg",palette.bg);root.setProperty("--bg2",palette.bg2);
  root.setProperty("--paper",palette.paper);root.setProperty("--text-dim",palette.textDim);
  root.setProperty("--text-dim2",palette.textDim2);root.setProperty("--accent",palette.accent);
  root.setProperty("--accent-dim",palette.accentDim);
  const fullName=`${profile.firstName} ${profile.lastName}`;
  const website=(ui.canonicalUrl||profile.website||"").replace(/^https?:\/\//,"").replace(/\/$/,"");
  document.getElementById("social-card").innerHTML=`
    <section class="social-card">
      <div class="portrait">${profile.photoUrl?`<img src="${escapeHtml(profile.photoUrl)}" alt="">`:escapeHtml(profile.photoInitials)}</div>
      <div class="content">
        <h1 class="name">${escapeHtml(fullName)}</h1>
        ${profile.title?`<p class="role">${escapeHtml(profile.title)}</p>`:""}
        ${profile.company?`<p class="company">${escapeHtml(profile.company)}</p>`:""}
        ${profile.bio?`<p class="bio">${escapeHtml(profile.bio)}</p>`:""}
        <div class="details">
          ${profile.address?`<span>${escapeHtml(profile.address)}</span>`:""}
          ${profile.email?`<span>${escapeHtml(profile.email)}</span>`:""}
        </div>
      </div>
      ${website?`<div class="website">${escapeHtml(website)}</div>`:""}
    </section>`;
  document.documentElement.dataset.rendered="true";
}
render().catch(error=>{console.error(error);document.documentElement.dataset.rendered="error"});
</script>
</body>
</html>
